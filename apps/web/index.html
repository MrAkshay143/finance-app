<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1B3A" />
    <meta name="application-name" content="Finance Tracker" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finance Tracker" />
    <title>Finance Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="/config.js"></script>
  </head>
  <body class="bg-[#F8FAFC] text-[#101828] font-sans antialiased">
    <!-- Single Unified Modern Splash Screen (faded out cleanly once React mounts) -->
    <div id="app-splash" style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F8FAFC;font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;transition:opacity 350ms cubic-bezier(0.4, 0, 0.2, 1), visibility 350ms;">
      <!-- Ambient background glows -->
      <div style="position:absolute;top:-96px;left:-96px;width:320px;height:320px;background:rgba(219,234,254,0.6);border-radius:9999px;filter:blur(64px);pointer-events:none;"></div>
      <div style="position:absolute;bottom:-96px;right:-96px;width:320px;height:320px;background:rgba(224,231,255,0.6);border-radius:9999px;filter:blur(64px);pointer-events:none;"></div>

      <div style="position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px;">
        <div style="width:68px;height:68px;border-radius:20px;background:#132A5C;border:1px solid rgba(11,27,58,0.2);display:flex;align-items:center;justify-content:center;box-shadow:0 15px 30px -5px rgba(19,42,92,0.25);margin-bottom:16px;outline:4px solid rgba(255,255,255,0.9);overflow:hidden;">
          <img src="/pwa-192x192.png" alt="Finance Tracker" style="width:50px;height:50px;border-radius:14px;object-fit:cover;" onerror="this.style.display='none'" />
        </div>
        <h1 style="font-size:21px;font-weight:900;letter-spacing:-0.03em;color:#0F172A;margin:0 0 4px 0;">Finance Tracker</h1>
        <p style="font-size:12px;font-weight:500;color:#64748B;margin:0 0 24px 0;">Personal Wealth &amp; Spending Hub</p>
        <div style="width:120px;height:4px;background:#E2E8F0;border-radius:9999px;overflow:hidden;position:relative;">
          <div style="width:50%;height:100%;background:#2563EB;border-radius:9999px;animation:splashPulse 1.2s ease-in-out infinite;"></div>
        </div>
      </div>
    </div>
    <style>
      @keyframes splashPulse {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(100%); }
        100% { transform: translateX(200%); }
      }
      #app-splash.fade-out {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      setTimeout(function() {
        var s = document.getElementById('app-splash');
        if (s && !s.classList.contains('fade-out')) {
          s.classList.add('fade-out');
          setTimeout(function() { if (s && s.parentNode) s.parentNode.removeChild(s); }, 400);
        }
      }, 3500);
    </script>
  </body>
</html>
