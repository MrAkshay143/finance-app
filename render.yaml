services:
  # ============================================================================
  # Backend API Web Service
  # ============================================================================
  - type: web
    name: finance-tracker-backend
    env: node
    buildCommand: npm install -g pnpm@11.13.0 && pnpm install --frozen-lockfile && pnpm -r --filter="./packages/*" run build && pnpm --filter @finance/backend build
    startCommand: pnpm --filter @finance/backend db:migrate && pnpm --filter @finance/backend start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: finance-tracker-db
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://finance-tracker-web.onrender.com

  # ============================================================================
  # Frontend Static Web Site
  # ============================================================================
  - type: static
    name: finance-tracker-web
    buildCommand: npm install -g pnpm@11.13.0 && pnpm install --frozen-lockfile && pnpm -r --filter="./packages/*" run build && pnpm --filter @finance/web build
    staticPublishPath: apps/web/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://finance-tracker-backend.onrender.com

# ==============================================================================
# Managed PostgreSQL 16 Database
# ==============================================================================
databases:
  - name: finance-tracker-db
    databaseName: finance_tracker
    user: postgres
    postgresMajorVersion: 16
