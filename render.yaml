services:
  # ============================================================================
  # Backend API Web Service
  # ============================================================================
  - type: web
    name: finance-tracker-backend
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile && pnpm -r --filter="./packages/*" run build && pnpm --filter @finance/backend build
    startCommand: ./apps/backend/node_modules/.bin/prisma migrate deploy --schema apps/backend/prisma/schema.prisma && node apps/backend/dist/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: finance-tracker-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: finance-tracker-redis
          envVarKey: REDIS_URL
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_RESET_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STANDARD_USER_EMAIL
        sync: false
      - key: STANDARD_USER_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://finance-tracker-web.onrender.com"

  # ============================================================================
  # Frontend Static Web Site
  # ============================================================================
  - type: web
    name: finance-tracker-web
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile && pnpm -r --filter="./packages/*" run build && pnpm --filter @finance/web build
    staticPublishPath: apps/web/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_API_URL
        value: https://finance-tracker-backend-eyz1.onrender.com

# ==============================================================================
# Managed PostgreSQL 16 Database
# ==============================================================================
databases:
  - name: finance-tracker-db
    plan: free
    databaseName: finance_tracker
    postgresMajorVersion: 16

# ==============================================================================
# Background Worker Service
# ==============================================================================
  - type: worker
    name: finance-tracker-worker
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile && pnpm -r --filter="./packages/*" run build && pnpm --filter @finance/backend build
    startCommand: node apps/backend/dist/worker.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: finance-tracker-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: finance-tracker-redis
          envVarKey: REDIS_URL

# ==============================================================================
# Managed Redis Instance
# ==============================================================================
  - type: redis
    name: finance-tracker-redis
    plan: free
    ipAllowList: [] # only allow internal services

