services:
  # Backend API Service
  - type: web
    name: finance-tracker-backend
    env: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm -r --filter="./packages/*" run build && pnpm --filter @finance/backend build
    startCommand: pnpm --filter @finance/backend db:migrate && pnpm --filter @finance/backend start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: finance-tracker-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: finance-tracker-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://finance-tracker-web.onrender.com

  # Frontend Web Static Site
  - type: static
    name: finance-tracker-web
    buildCommand: pnpm install --frozen-lockfile && pnpm -r --filter="./packages/*" run build && pnpm --filter @finance/web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://finance-tracker-backend.onrender.com

databases:
  - name: finance-tracker-db
    databaseName: finance_tracker
    user: postgres
    plan: starter
    postgresMajorVersion: 16

# Redis Cache Service
redis:
  - name: finance-tracker-redis
    plan: starter
    ipAllowList: []
