services:
  # ============================================================================
  # Backend API Web Service
  # ============================================================================
  - type: web
    name: finance-tracker-backend
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@11.13.0 --activate && pnpm install --frozen-lockfile && pnpm -r --filter="./packages/*" run build && pnpm --filter @finance/backend build
    startCommand: npx prisma migrate deploy --schema apps/backend/prisma/schema.prisma && node apps/backend/dist/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: finance-tracker-db
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://finance-tracker-web.onrender.com

  # ============================================================================
  # Frontend Static Web Site
  # ============================================================================
  - type: web
    name: finance-tracker-web
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@11.13.0 --activate && pnpm install --frozen-lockfile && pnpm -r --filter="./packages/*" run build && pnpm --filter @finance/web build
    staticPublishPath: apps/web/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_API_URL
        value: https://finance-tracker-backend.onrender.com

# ==============================================================================
# Managed PostgreSQL 16 Database
# ==============================================================================
databases:
  - name: finance-tracker-db
    plan: free
    databaseName: finance_tracker
    postgresMajorVersion: 16
