name: Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Verify Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Zero-placeholder gate
        run: pnpm run check:placeholders

      - name: Run test suite
        run: pnpm run test

      - name: Build monorepo
        run: pnpm run build

  build-docker-images:
    name: Build & Tag Container Images
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: false
          tags: |
            finance-tracker-backend:${{ github.sha }}
            finance-tracker-backend:latest

      - name: Build Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: false
          tags: |
            finance-tracker-web:${{ github.sha }}
            finance-tracker-web:latest

  deploy-staging:
    name: Deploy to Staging Environment
    needs: build-docker-images
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.finance.internal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Prisma Migrations on Staging DB
        run: |
          echo "Running database schema migrations against staging database..."

      - name: Deploy Staging Stack
        run: |
          echo "Deploying staging stack using docker-compose.prod.yml..."

      - name: Run Smoke Tests on Staging
        run: |
          echo "Verifying /healthz, /readyz, and /metrics on staging deployment..."

  deploy-production:
    name: Deploy to Production Environment
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.finance.internal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Database Migrations to Production
        run: |
          echo "Applying database schema migrations against production database..."

      - name: Rolling Deployment of Production Services
        run: |
          echo "Executing rolling deployment of backend, worker, and nginx..."

      - name: Production Health Check Gate
        run: |
          echo "Verifying production healthz and readyz status..."
